name: V2 backend CI
on:
  push:
    branches: [rebuild/v1-core]
    paths:
      - 'v2/backend/**'
      - 'v2/frontend/**'
      - '.github/workflows/v2-backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/backend/**'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: sqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p data && alembic upgrade head
      - run: pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          python -c "import re; s=open('../frontend/index.html', encoding='utf-8').read(); scripts=re.findall(r'<script>(.*?)</script>', s, re.S); assert scripts, 'no inline script found'; open('/tmp/frontend.js','w',encoding='utf-8').write(''.join(scripts))"
          node --check /tmp/frontend.js
