name: V2 backend CI
on:
  push:
    branches: [rebuild/v1-core]
    paths:
      - 'v2/backend/**'
      - 'v2/frontend/**'
      - '.github/workflows/v2-backend-ci.yml'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - 'docs/DEPLOYMENT_BACKUP_RESTORE.md'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'deploy/**'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'v2/backend/**'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: sqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p data && alembic upgrade head
      - run: pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          python -c "import re; s=open('../frontend/index.html', encoding='utf-8').read(); scripts=re.findall(r'<script>(.*?)</script>', s, re.S); assert scripts, 'no inline script found'; open('/tmp/frontend.js','w',encoding='utf-8').write(''.join(scripts))"
          node --check /tmp/frontend.js

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quote_ci
          POSTGRES_PASSWORD: quote_ci_password
          POSTGRES_DB: quote_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quote_ci -d quote_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: v2/backend
    env:
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://quote_ci:quote_ci_password@localhost:5432/quote_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Apply migrations on PostgreSQL 16
        run: alembic upgrade head
      - name: Validate backup script syntax
        run: bash -n ../../scripts/backup.sh
      - name: Validate migration and cron scripts syntax
        run: |
          bash -n ../../scripts/migrate-out.sh
          bash -n ../../scripts/migrate-in.sh
          bash -n ../../scripts/install-cron.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t phone-quote-system:ci .
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_LONG_RANDOM_DATABASE_PASSWORD/ci-only-database-password/g; s/REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS/ci-only-secret-key-at-least-32-characters/g' .env
          docker compose config --quiet
