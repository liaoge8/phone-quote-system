services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POLICY_EVIDENCE_DIR: /app/data/policy-evidence
      ENVIRONMENT: production
    volumes:
      - policy_evidence:/app/data/policy-evidence
      - backup_archives:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [internal]

  backup:
    image: postgres:16
    profiles: ["tools"]
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POLICY_EVIDENCE_DIR: /evidence
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - policy_evidence:/evidence:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  restore:
    image: postgres:16
    profiles: ["tools"]
    entrypoint: ["bash", "/scripts/restore.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POLICY_EVIDENCE_DIR: /evidence
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    volumes:
      - ./scripts:/scripts:ro
      - policy_evidence:/evidence
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  policy_evidence:
  backup_archives:

networks:
  internal:
    driver: bridge
